    <meta name="twitter:title" content="SimpleVoiceChatWeb – Tools">
    <meta name="twitter:description" content="Config editor and firewall helper for SimpleVoiceChatWeb.">

    <script>
        // Keep path, query (?code=…) and hash (#/config)
        window.location.replace(
            "https://SimpleVoiceChatWeb.github.io"
            + location.pathname
            + location.search
            + location.hash
        );
