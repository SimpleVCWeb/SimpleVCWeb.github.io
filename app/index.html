<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>SimpleVoiceChatWeb – Voice chat</title>

    <!-- Link previews (Discord, WhatsApp, Slack, Telegram) do not run JavaScript,
         so these tags must stay in the static HTML of the redirect page. -->
    <meta name="description" content="Open the SimpleVoiceChatWeb browser client and join a Simple Voice Chat Minecraft server.">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="SimpleVoiceChatWeb">
    <meta property="og:title" content="SimpleVoiceChatWeb – Voice chat">
    <meta property="og:description" content="Join a Simple Voice Chat Minecraft server from your browser. No mod installation needed for the web client.">
    <meta property="og:url" content="https://SimpleVCWeb.github.io/app">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="SimpleVoiceChatWeb – Voice chat">
    <meta name="twitter:description" content="Join a Simple Voice Chat Minecraft server from your browser.">

    <script>
        // Keep path, query (?code=…) and hash (#/login)
        window.location.replace(
            "https://SimpleVoiceChatWeb.github.io"
            + location.pathname
            + location.search
            + location.hash
        );
    </script>
</head>
<body>
    <p>Redirecting to <a href="https://SimpleVoiceChatWeb.github.io">SimpleVoiceChatWeb.github.io</a> …</p>
</body>
</html>
