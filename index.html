<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex">
    <title>Redirecting …</title>
    <script>
        // Keep path, query (?code=…) and hash (#/login)
        window.location.replace(
            "https://SimpleVoiceChatWeb.github.io"
            + location.pathname
            + location.search
            + location.hash
        );
    </script>
</head>

</body>
